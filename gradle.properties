# ✅ تنظیمات JVM (حافظه کافی برای بیلد)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# ✅ فعال‌سازی AndroidX (حیاتی — بدون این، core-ktx و emoji2 کامپایل نمی‌شوند)
android.useAndroidX=true

# ✅ سبک کد رسمی Kotlin
kotlin.code.style=official

# ✅ بیلد موازی (سرعت بیشتر)
org.gradle.parallel=true

# ✅ بیلد افزایشی Kotlin
kotlin.incremental=true

# ✅ R class غیرتراگذری (کاهش حجم APK)
android.nonTransitiveRClass=true

# ✅ کش بیلد محلی
org.gradle.caching=true
